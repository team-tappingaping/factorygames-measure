<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>FTT 원격 측정</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      #participant-overlay {
        position: fixed; inset: 0; background: rgba(10,10,12,0.82);
        display: flex; align-items: center; justify-content: center;
        font-family: system-ui, sans-serif; z-index: 100; transition: opacity .3s ease;
      }
      #participant-overlay.hidden { opacity: 0; pointer-events: none; }
      #participant-card {
        background: #1f2226; border: 1px solid #33383f; border-radius: 10px;
        padding: 28px 26px; width: 300px; color: #e9eaec;
      }
      #participant-card h2 { margin: 0 0 6px; font-size: 17px; }
      #participant-card p { margin: 0 0 18px; font-size: 13px; color: #9aa1ab; line-height: 1.5; }
      #participant-card label { font-size: 12px; color: #9aa1ab; display: block; margin-bottom: 4px; }
      #participant-card input[type=text] {
        width: 100%; box-sizing: border-box; background: #262a2f; border: 1px solid #33383f;
        color: #e9eaec; border-radius: 5px; padding: 9px 10px; font-size: 14px; margin-bottom: 14px;
      }
      #hand-group { display: flex; border: 1px solid #33383f; border-radius: 5px; overflow: hidden; margin-bottom: 18px; }
      #hand-group button {
        flex: 1; background: #262a2f; color: #9aa1ab; border: none; padding: 8px 0;
        font-size: 13px; cursor: pointer; border-right: 1px solid #33383f;
      }
      #hand-group button:last-child { border-right: none; }
      #hand-group button.active { background: #e2a33b; color: #1a1200; font-weight: 600; }
      #apply-btn {
        width: 100%; background: #e2a33b; color: #1a1200; border: none; border-radius: 5px;
        padding: 11px 0; font-size: 14px; font-weight: 600; cursor: pointer;
      }
      #apply-btn:disabled { opacity: .5; cursor: default; }
      #apply-status { font-size: 12px; color: #5fb36a; margin-top: 10px; min-height: 14px; }
    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=1280 height=720 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">FTT 원격 측정</div>
      </div>
    </div>

    <div id="participant-overlay" class="hidden">
      <div id="participant-card">
        <h2>참가자 정보</h2>
        <p>코드를 입력하고 "적용하고 시작"을 누르면 게임 화면에서 바로 측정을 시작할 수 있어요. 결과 CSV는 끝나면 이 PC의 다운로드 폴더에 자동으로 저장돼요.</p>
        <label for="pcode">참가자 코드</label>
        <input type="text" id="pcode" placeholder="예: 홍길동">
        <label>측정하는 손</label>
        <div id="hand-group">
          <button id="handLeft" data-hand="left">왼손</button>
          <button id="handRight" data-hand="right" class="active">오른손</button>
        </div>
        <button id="apply-btn" disabled>불러오는 중...</button>
        <div id="apply-status"></div>
      </div>
    </div>

    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/FTT.loader.js";
      var config = {
        dataUrl: buildUrl + "/FTT.data.unityweb",
        frameworkUrl: buildUrl + "/FTT.framework.js.unityweb",
        codeUrl: buildUrl + "/FTT.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "FactoryGames",
        productName: "FTT",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        container.className = "unity-mobile";
        canvas.className = "unity-mobile";
      } else {
        canvas.style.width = "1280px";
        canvas.style.height = "720px";
      }

      loadingBar.style.display = "block";

      var overlay = document.getElementById('participant-overlay');
      var applyBtn = document.getElementById('apply-btn');
      var applyStatus = document.getElementById('apply-status');
      var pcodeInput = document.getElementById('pcode');
      var handLeftBtn = document.getElementById('handLeft');
      var handRightBtn = document.getElementById('handRight');
      var selectedHand = 'right';
      var unityInstanceRef = null;

      handLeftBtn.addEventListener('click', function () {
        selectedHand = 'left';
        handLeftBtn.classList.add('active');
        handRightBtn.classList.remove('active');
      });
      handRightBtn.addEventListener('click', function () {
        selectedHand = 'right';
        handRightBtn.classList.add('active');
        handLeftBtn.classList.remove('active');
      });

      applyBtn.addEventListener('click', function () {
        var code = pcodeInput.value.trim();
        if (!code) { applyStatus.style.color = '#d9893a'; applyStatus.textContent = '코드를 입력해주세요'; return; }
        if (!unityInstanceRef) return;
        unityInstanceRef.SendMessage('Systems', 'SetParticipant', code);
        unityInstanceRef.SendMessage('Systems', 'SetHand', selectedHand);
        applyStatus.style.color = '#5fb36a';
        applyStatus.textContent = '적용됨: ' + code + ' / ' + (selectedHand === 'left' ? '왼손' : '오른손');
        overlay.classList.add('hidden');
      });

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
          unityInstanceRef = unityInstance;
          applyBtn.disabled = false;
          applyBtn.textContent = "적용하고 시작";
          overlay.classList.remove('hidden');
          fullscreenButton.onclick = () => {
            unityInstance.SetFullscreen(1);
          };
        }).catch((message) => {
          alert(message);
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
